name: Publish

# Fires when a GitHub Release is published. Also supports manual dispatch for
# an ad-hoc image push.
#
# Release flow:
#   1. Merge to main
#   2. Create a GitHub Release with a tag like v1.2.3
#   3. This workflow pushes valkvlabs/valkvedge-cli (v1.2.3 and latest) and
#      attaches prebuilt binaries with checksums to the release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.2.3)"
        required: true
        type: string

env:
  ORG: valkvlabs
  IMAGE: valkvedge-cli
  TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          push: true
          tags: |
            ${{ env.ORG }}/${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.ORG }}/${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

  binaries:
    name: Binary (${{ matrix.target }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: valkvedge-cli
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: valkvedge-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: valkvedge-cli.exe
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p valkvedge-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="valkvedge-cli-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" valkvedge-cli-*.tar.gz valkvedge-cli-*.sha256 --clobber
